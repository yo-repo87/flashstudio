name: Publish image
# Loads the prebuilt image tarball attached to the release and pushes it to ghcr.io.
# (The image is built locally from the Flashforge installer, which is not in this repo.)
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the image tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download image-1.7.15-res1.7.20 --repo "$GITHUB_REPOSITORY" --pattern flashstudio-image.tar.zst
      - name: Load and push
        run: |
          set -e
          zstd -dc flashstudio-image.tar.zst | docker load
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push ghcr.io/yo-repo87/flashstudio:1.7.15-res1.7.20
          docker push ghcr.io/yo-repo87/flashstudio:latest
